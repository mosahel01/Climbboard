services:
  redis:
    image: redis:7-alpine
    container_name: bazarirank-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build: ./backend
    container_name: bazarirank-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-production
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data: